name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade buildozer "cython<3" virtualenv setuptools

      - name: Prepare patched python-for-android
        run: |
          git clone --depth 1 --branch v2024.01.21 https://github.com/kivy/python-for-android.git ~/p4a-src
          python3 - <<'PY'
          import os, pathlib
          tpl = pathlib.Path(os.path.expanduser(
              "~/p4a-src/pythonforandroid/bootstraps/sdl2/build/templates/AndroidManifest.tmpl.xml"))
          text = tpl.read_text(encoding="utf-8")
          extra = pathlib.Path("extra_manifest_application.xml").read_text(encoding="utf-8")
          marker = "{% for l in args.android_used_libs %}"
          assert marker in text, "marker not found in manifest template"
          tpl.write_text(text.replace(marker, extra + "\n        " + marker, 1), encoding="utf-8")
          print("manifest template patched")
          PY

      - uses: actions/cache@v4
        with:
          path: |
            .buildozer
            ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Build APK (debug)
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          grep -n -i -E "error|failed|exception|not found" build.log | grep -v -E "Compiling|adding:|copy \./|running zip" | tail -40
          echo "=========== TAIL ==========="
          tail -60 build.log | cut -c1-400

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schedule-apk
          path: bin/*.apk
          if-no-files-found: error
